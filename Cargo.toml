[package]
name = "voxelizer"
version = "0.1.0"
edition = "2024"

[dependencies]
dashmap = { version = "6.2.1", optional = true }
hashbrown = { version = "0.17.1", optional = true }
rayon = { version = "1.12.0", optional = true }
wgpu = { version = "30.0.1", optional = true }
zorder = { version = "0.2.2", optional = true }

[features]
default = ["single_threaded"]
multi_threaded = ["dep:rayon", "dep:dashmap", "dep:zorder"]
single_threaded = ["dep:hashbrown", "dep:zorder"]
wgpu = ["dep:wgpu"]
