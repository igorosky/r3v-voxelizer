[package]
name = "r3v-voxelizer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bytemuck = { version = "1.25.2", optional = true }
dashmap = { version = "6.2.1", optional = true }
hashbrown = { version = "0.17.1", optional = true }
pollster = { version = "1.0.1", optional = true }
pyo3 = { version = "0.29.3", optional = true, features = ["extension-module"] }
rayon = { version = "1.12.0", optional = true }
wgpu = { version = "30.0.1", optional = true }
zorder = { version = "0.2.2", optional = true }

[dev-dependencies]
libtest-mimic = "0.8"

[build-dependencies]
cbindgen = { version = "0.29.4", optional = true }
pyo3-build-config = { version = "0.29.3", optional = true }

[features]
default = ["single_threaded"]
c = ["dep:pollster", "dep:cbindgen"]
cpp = ["dep:pollster", "dep:cbindgen"]
multi_threaded = ["dep:rayon", "dep:dashmap", "dep:zorder"]
python = ["dep:pyo3", "dep:pyo3-build-config"]
single_threaded = ["dep:hashbrown", "dep:zorder"]
wgpu = ["dep:wgpu", "dep:bytemuck"]

[[test]]
name = "c_bindings"
harness = false
required-features = ["c", "multi_threaded", "single_threaded"]

[[test]]
name = "python_bindings"
harness = false
required-features = ["python"]
